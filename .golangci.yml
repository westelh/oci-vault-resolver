# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

linters:
  # errcheck / govet / ineffassign / staticcheck / unused
  default: standard
  enable:
    - contextcheck
    - errorlint
    - errname
    - gosec
    - nilerr
    - noctx
    - revive
    - sloglint
    - usetesting
  exclusions:
    rules:
      # G101 は名前に SECRET を含む定数を認証情報と判定する。対象は環境変数名・Kubernetes Secret の名前と、
      # URL のパスワードを伏せることを確かめるテスト用のダミー URL で、どれも認証情報ではない。
      - path: ^(config|kubesecret|kubesecret_test|main_test)\.go$
        linters: [gosec]
        text: "G101:"
      # G404 は再試行の待ち時間を揺らすための math/rand を指す。予測されても困らないので crypto/rand は要らない。
      - path: ^vault\.go$
        linters: [gosec]
        text: "G404:"
