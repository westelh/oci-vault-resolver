name: resolver

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - tools/go.mod
      - tools/go.sum
      - Dockerfile
      - justfile
      - hk.pkl
      - aqua.yaml
      - aqua-checksums.json
      - .golangci.yml
      - _typos.toml
      - .editorconfig
      - "**.md"
      - .github/**
  push:
    tags:
      - "v*"
  # test と verify-image だけを動かす。公開は v* タグの push のみ。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/westelh/oci-vault-resolver
  PLATFORMS: amd64 arm64
  # タグの push ではタグ名をバイナリの version に埋め込む。それ以外は dev。
  RESOLVER_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
  AQUA_VERSION: v2.66.1

# Actions はタグの差し替えの影響を受けないようコミット SHA で固定し、Dependabot で更新する。
# verify-image でビルドした archive をそのまま公開するので、publish 以外のジョブの Actions も固定する。
#
# verify-image から publish へは、イメージをレジストリではなく OCI archive の artifact で受け渡す。
# 未検証のイメージをタグなしでもレジストリに置かず、起動確認した archive をそのまま公開するため。
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 公開するのは vX.Y.Z の形式のタグだけ。合わないタグ（v1.2.3-rc1 など）はテストやイメージのビルドの前に落とす。
      - name: Check the tag is vX.Y.Z
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::タグは vX.Y.Z の形式にしてください: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # このワークフローは v* タグで公開するので、別の run が書いたキャッシュを読まない。
          cache: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
          packages: hk just golangci-lint actionlint zizmor shellcheck typos
      # zizmor は GH_TOKEN があるとオンラインの監査（impostor-commit など）も行う。
      - name: hk check
        env:
          GH_TOKEN: ${{ github.token }}
        run: hk check --all

  verify-image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # このワークフローは v* タグで公開するので、別の run が書いたキャッシュを読まない。
          cache: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
          packages: just
      - name: Build binaries
        env:
          RESOLVER_PLATFORMS: ${{ env.PLATFORMS }}
        run: just build
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GHCR はマルチアーキテクチャのイメージの説明やリポジトリを config のラベルではなく index の annotation から読むため、
      # annotation は index に付ける。
      - name: Generate image labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      # 検証したものをそのまま公開するため、マルチアーキテクチャの OCI アーカイブを一度だけ作る。
      # 来歴は publish で GitHub の attestation として署名付きで付けるので、buildx の provenance は付けない。
      # dist のバイナリはコミットしていないので、Git のコンテキストではなく作業ディレクトリをコンテキストにする。
      - name: Build multi-arch OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # PLATFORMS と揃える。
          platforms: linux/amd64,linux/arm64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=oci,dest=image.tar
      # OCI archive を扱うのに skopeo を使う。buildx には archive を後から push する手段がなく、
      # docker daemon の従来の image store はマルチプラットフォームの index を保持できず、
      # push 時に digest が変わりうる。skopeo は ubuntu-24.04 ランナーに入っているものを使う。
      - name: Start the image on each architecture
        run: |
          for arch in $PLATFORMS; do
            skopeo copy --override-arch "$arch" oci-archive:image.tar "docker-daemon:oci-vault-resolver:verify-$arch"
            out="$(docker run --rm --platform "linux/$arch" "oci-vault-resolver:verify-$arch" --version)"
            echo "$out"
            expected="oci-vault-resolver $RESOLVER_VERSION linux/$arch"
            if [ "$out" != "$expected" ]; then
              echo "::error::想定した出力は '$expected' です"
              exit 1
            fi
          done
      # publish が使う archive なので、publish と同じ条件でだけ upload する。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'westelh/oci-vault-resolver' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: image
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  # 公開は v* タグの push のみ。公開済みのタグは作り直さない。
  publish:
    needs: verify-image
    if: github.repository == 'westelh/oci-vault-resolver' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # push 権限があれば main 以外のコミットにも v* タグを打てるので、タグのコミットが main に入っていることを確かめる。
      # タグを作れる人を絞っても、どのコミットに打つかは縛れないため、ここで判定する。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME のコミット $commit は main に含まれていません。main に入ったコミットにタグを打ってください"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 再実行やタグの打ち直しで公開済みのタグが別の digest に置き換わらないよう、タグがないことを確かめてから push する。
      # 初回の公開ではパッケージ自体がないので、manifest unknown に加えて name unknown もタグがないものとして扱う。
      - name: Refuse to overwrite a published tag
        run: |
          if out="$(skopeo inspect --raw "docker://$IMAGE:$GITHUB_REF_NAME" 2>&1)"; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME は公開済みです"
            exit 1
          elif ! printf '%s' "$out" | grep -Eqi 'manifest unknown|name unknown'; then
            echo "::error::タグの存在を確認できませんでした: $out"
            exit 1
          fi
      # 検証した archive と同じ digest で公開するため、docker daemon を経由せず skopeo で直接 push する。
      - name: Push the verified archive
        id: push
        run: |
          skopeo copy --all --preserve-digests --digestfile digest oci-archive:image.tar "docker://$IMAGE:$GITHUB_REF_NAME"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      # storage record は organization が所有するリポジトリでしか作れないので作らない。
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
      - name: Inspect the published image
        run: |
          {
            echo "### $IMAGE:$GITHUB_REF_NAME"
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
