version: 2
updates:
  # Dockerfile のベースイメージは digest で固定しているので、更新は Dependabot に任せる。
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # ワークフローの Actions はコミット SHA で固定しているので、更新は Dependabot に任せる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # 公開直後の版を避けるため 3 日待つ。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        patterns:
          - "*"
