version: 2
updates:
  # 公開直後の版を避けるため、どのエコシステムも 7 日待つ。
  # Dockerfile のベースイメージは digest で固定しているので、更新は Dependabot に任せる。
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # ワークフローの Actions はコミット SHA で固定しているので、更新は Dependabot に任せる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
